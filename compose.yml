volumes:
  pg_data:
#  rustfs_data:
#  kafka_data:

services:
  service:
    container_name: backend
    build:
      context: .
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SERVER_ADDR: "0.0.0.0:8080"

      POSTGRES_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      POSTGRES_MAX_CONNS: "${POSTGRES_MAX_CONNS}"

      JWT_SECRET: "${JWT_SECRET}"

#      S3_REGION: "us-east-1"
#      S3_ENDPOINT: "http://rustfs:9000"
#      S3_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
#      S3_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
#      S3_BUCKET_NAME: "${RUSTFS_BUCKET_NAME}"
#
#      KAFKA_ADDR: "kafka:9093"
#      KAFKA_READER_GROUP_ID: "${KAFKA_READER_GROUP_ID}"
#      KAFKA_TOPIC: "${KAFKA_TOPIC}"

#      VALKEY_ADDR: "valkey:6379"
#      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: backend_postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

